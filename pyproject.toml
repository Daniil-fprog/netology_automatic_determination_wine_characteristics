[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wine-characteristics-ml"
version = "1.0.0"
description = "Wine characteristics prediction from Russian text descriptions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "numpy>=1.26,<3",
  "scikit-learn==1.9.0",
  "joblib>=1.4,<2",
]

[project.optional-dependencies]
notebook = [
  "pandas>=2.2,<3",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "jupyter>=1,<2",
]
test = ["pytest>=7.4,<9", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
